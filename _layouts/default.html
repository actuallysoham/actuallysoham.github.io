<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="https://kit.fontawesome.com/1c285cdea4.js" crossorigin="anonymous"></script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <script>
        // Prevent flash of unstyled content - set theme immediately
        (function() {
            let theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (!theme) {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <header class="navbar{% if page.url == "/" %} is-home{% endif %}">
        <nav class="nav-content" aria-label="Main">
            <a href="/" class="nav-name">Soham De</a>
            <div class="nav-links" id="nav-links">
                <a href="/research" {% if page.url contains "research" %}class="active" aria-current="page"{% endif %}>Research</a>
                <a href="/blog" {% if page.url contains "blog" %}class="active" aria-current="page"{% endif %}>Non-Research</a>
                <a href="/people" {% if page.url contains "people" %}class="active" aria-current="page"{% endif %}>People</a>
                <a href="/gallery" {% if page.url contains "gallery" %}class="active" aria-current="page"{% endif %}>Gallery</a>
            </div>
            <div class="nav-actions">
                <button class="dark-mode-toggle" aria-label="Change theme" title="Change theme">
                    <i class="theme-icon fa-solid fa-sun"></i>
                </button>
                <button class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </nav>
    </header>

    <div class="content">
        {% if page.url == "/" %}
        <div class="header">
            <div class="profile-img-wrapper">
                <img src="/assets/images/profile.jpg" alt="{{ site.title }}" class="profile-img">
            </div>
            <div class="header-content">
                <h1>
                    <span class="first-name">Soham De</span> 
                </h1>
                <p>PhD candidate at <a href="https://www.washington.edu">UW</a></p>
                <p>sohamde[AT]uw.edu</p>
                <div class="social-links">
                    <a href="https://bsky.app/profile/{{ site.bluesky_username }}" title="Bluesky"><i class="fa-brands fa-bluesky"></i></a>
                    <a href="https://twitter.com/{{ site.twitter_username }}" title="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://github.com/{{ site.github_username }}" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="https://scholar.google.com/citations?user={{ site.scholar_username }}" title="Google Scholar"><i class="fa-brands fa-google-scholar"></i></a>
                    <a href="/assets/pdf/cv.pdf" class="link-button social-cv">View CV</a>
                </div>
            </div>
        </div>
        {% endif %}

        {{ content }}

        <footer class="footer">
            <div class="footer-content">
                <span>Soham De</span>
                <span>sohamde[at]uw.edu</span>
                <div class="social-links">
                    <a href="https://bsky.app/profile/{{ site.bluesky_username }}" title="Bluesky"><i class="fa-brands fa-bluesky"></i></a>
                    <a href="https://twitter.com/{{ site.twitter_username }}" title="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://github.com/{{ site.github_username }}" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="https://scholar.google.com/citations?user={{ site.scholar_username }}" title="Google Scholar"><i class="fa-brands fa-google-scholar"></i></a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            const navbar = document.querySelector('.navbar');
            const header = document.querySelector('.header');
            const toggle = document.querySelector('.menu-toggle');
            const links = document.getElementById('nav-links');

            // Hairline under the navbar once the page scrolls; on the homepage,
            // reveal the name once the profile header has scrolled away.
            function onScroll() {
                navbar.classList.toggle('scrolled', window.scrollY > 4);
                if (header) {
                    navbar.classList.toggle('show-name', header.getBoundingClientRect().bottom < 60);
                }
            }
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();

            // Mobile menu
            function setMenu(open) {
                navbar.classList.toggle('menu-open', open);
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
            toggle.addEventListener('click', function() {
                setMenu(!navbar.classList.contains('menu-open'));
            });
            links.addEventListener('click', function(e) {
                if (e.target.closest('a')) setMenu(false);
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') setMenu(false);
            });
        })();
    </script>

    <script src="/assets/js/dark-mode.js"></script>
    <script src="/assets/js/research.js"></script>
    <script src="/assets/js/people.js"></script>
    <script src="/assets/js/misc.js"></script>
    <script src="/assets/js/gallery.js"></script>
</body>
</html>
